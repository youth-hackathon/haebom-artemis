<style data-keep>
/* 레이아웃: 1280x720 슬라이드를 화면에 맞춰 줄여 보여 준다. 발표 화면(한 장씩)과 모아 보기·편집 화면 두 가지. 파랑은 Jev, 주황은 LLM */
:root{

  --font-display:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101318; --deck-bg:#0a0c10; --surface:#181c22; --surface-2:#20252c; --ink:#eef1f4; --ink-2:#b8c0c9; --ink-3:#8a94a0; --line:#2d343d;
    --jev:#3987e5; --jev-soft:#17273b; --llm:#d95926; --llm-soft:#35211a; --bad:#e66767; --ok:#3b444f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101318; --deck-bg:#0a0c10; --surface:#181c22; --surface-2:#20252c; --ink:#eef1f4; --ink-2:#b8c0c9; --ink-3:#8a94a0; --line:#2d343d;
  --jev:#3987e5; --jev-soft:#17273b; --llm:#d95926; --llm-soft:#35211a; --bad:#e66767; --ok:#3b444f; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;margin:0;-webkit-font-smoothing:antialiased}
body.deck-mode{background:var(--deck-bg);overflow:hidden}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;font-size:0.88rem;font-weight:500;cursor:pointer;line-height:1.3;white-space:nowrap}

.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);padding:6px 8px}

code{font-family:var(--font-mono);font-size:0.86em;background:var(--surface-2);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}

/* ---------- 슬라이드 (설계 크기 1280x720) ---------- */
.fit{position:relative;flex:none}
.stage{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:top left;background:var(--surface);color:var(--ink);padding:52px 68px 38px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:26px;overflow:hidden;border-radius:4px}
.s-kick{font-size:15px;font-weight:600;color:var(--ink-3);letter-spacing:0.03em;display:flex;gap:10px;align-items:center}
.s-tag{font-family:var(--font-mono);font-weight:500;color:var(--jev);letter-spacing:0}
.s-title{font-family:var(--font-display);font-weight:700;font-size:36px;line-height:1.28;margin:6px 0 0;letter-spacing:-0.015em;text-wrap:balance}
.s-lead{font-size:21px;color:var(--ink-2);margin:10px 0 0;max-width:46em;line-height:1.5}
.s-edited{font-size:13px;color:var(--ink-3);margin-top:6px}
.s-body{min-height:0;overflow:hidden;display:grid;gap:44px;align-items:start}
.l-split .s-body{grid-template-columns:minmax(0,1fr) minmax(0,1.12fr)}
.l-summary .s-body{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.l-wide .s-body,.l-text .s-body{grid-template-columns:minmax(0,1fr);gap:24px;align-content:start}
.l-cover{padding:64px 72px 40px}

.l-cover .s-body{align-content:end}
.s-foot{display:flex;justify-content:space-between;gap:24px;font-size:13px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px}
.s-foot .src{font-family:var(--font-mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.s-foot .pg{font-family:var(--font-mono);flex:none}
.pts-wrap{display:grid;gap:14px;min-width:0}
.pts-label{font-size:15px;font-weight:600;color:var(--ink-2);letter-spacing:0.02em}

.l-wide .pts{font-size:20px;gap:8px}

.pts li{position:relative;padding-left:1.15em}
.pts li::before{content:"";position:absolute;left:0.1em;top:0.58em;width:0.42em;height:0.42em;border-radius:50%;border:2px solid var(--ink-3)}

.pts .who{font-size:0.62em;font-weight:600;color:var(--jev);margin-left:0.5em;font-family:var(--font-body);white-space:nowrap}
.viz{min-width:0;display:grid;gap:14px;align-content:start}

.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.sw.jev,.bar.jev,.seg.jev{background:var(--jev)}
.sw.llm,.bar.llm,.seg.llm{background:var(--llm)}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.tile{border:1px solid var(--line);border-radius:14px;padding:20px 24px;display:grid;gap:6px;align-content:start}
.tile .k{font-size:16px;color:var(--ink-2);font-weight:600}
.tile .v{font-family:var(--font-display);font-weight:700;font-size:40px;font-variant-numeric:tabular-nums;letter-spacing:-0.015em;line-height:1.2}
.tile .v .from{display:block;color:var(--ink-3);font-weight:500;font-size:0.6em;line-height:1.3}
.tile .s{font-size:16px;color:var(--ink-2)}

.chart{margin:0;display:grid;gap:8px;min-width:0}
.plot{position:relative;height:var(--ph,150px);margin-left:40px}
.gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.gl span{position:absolute;left:-40px;top:-0.55em;font-family:var(--font-mono);font-size:12px;color:var(--ink-3);line-height:1}
.base{position:absolute;left:0;right:0;bottom:0;border-top:1px solid var(--ink-3)}
.bars{position:absolute;inset:0;display:grid;grid-template-columns:repeat(55,minmax(0,1fr));column-gap:2px}
.col{display:flex;align-items:flex-end;height:100%}
.col:hover .bar{filter:brightness(1.15)}
.bar{width:100%;border-radius:3px 3px 0 0}
.gnames{margin-left:40px;display:grid;grid-template-columns:repeat(55,minmax(0,1fr));column-gap:2px}
.gname{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--line);padding-top:3px;margin-right:3px}

.hchart{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center}
.hlab{font-size:15px;color:var(--ink-2);white-space:nowrap}
.htrack{display:flex;align-items:center;gap:10px;min-width:0}
.hbar{display:flex;gap:2px;height:22px;min-width:4px}
.seg{height:100%}
.seg:last-child{border-radius:0 4px 4px 0}
.hval{font-family:var(--font-mono);font-size:15px;white-space:nowrap;color:var(--ink);font-variant-numeric:tabular-nums}
.note-line{font-size:16px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px}
.note-line b{font-family:var(--font-mono);color:var(--ink);font-weight:500}

.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ans{border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:10px;align-content:start;min-width:0}
.ans.jevc{border-color:var(--jev)}
.ans.llmc{border-color:var(--llm)}
.ans-head{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:18px;align-items:center}
.ans-head .who2{display:inline-flex;align-items:center;gap:8px}
.sec{font-family:var(--font-mono);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.ans-k{font-size:15px;color:var(--ink-2)}
.ans pre{margin:0;font-family:var(--font-mono);font-size:14px;background:var(--surface-2);border-radius:8px;padding:10px 12px;overflow:hidden;line-height:1.5;white-space:pre}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:16px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:600}

.flow{display:grid;gap:14px}
.lane{display:grid;gap:10px;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.lane-name{font-family:var(--font-mono);font-size:13px;color:var(--ink-3)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.node{border:1.5px solid var(--line);border-radius:9px;padding:7px 12px;font-size:17px;background:var(--surface);display:grid;line-height:1.3;font-weight:500}
.node small{font-size:13px;color:var(--ink-2);font-family:var(--font-mono);font-weight:400}
.node.jev{border-color:var(--jev);background:var(--jev-soft)}
.node.llm{border-color:var(--llm);background:var(--llm-soft)}
.arr{color:var(--ink-3);font-size:17px}
.branch{display:grid;gap:10px;padding-left:18px;border-left:2px solid var(--line);margin-left:10px}
.br{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15px;color:var(--ink-2)}
.br-k{font-weight:600;font-size:14px;min-width:4.4em;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:calc(4.4em + 8px)}
.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink-2);background:var(--surface)}
.chip b{font-family:var(--font-mono);color:var(--ink);font-weight:500;margin-left:4px}

.acc-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.acc-tiles .tile{padding:14px 18px}
.acc-tiles .tile .v{font-size:34px}
.acc-tiles .tile.jev-t{border-color:var(--jev)}
.acc-scroll{min-width:0}
.acc{display:grid;grid-template-columns:96px repeat(47,minmax(0,1fr));gap:4px;align-items:center}
.rl{font-size:14px;color:var(--ink-2);white-space:nowrap}
.cell{height:22px;border-radius:3px;background:var(--ok);display:grid;place-items:center;font-size:13px;font-weight:700;line-height:1}
.cell.bad{background:var(--bad);color:var(--surface)}
.cell.bad::after{content:"×"}
.cell.lg{width:18px;height:18px}

.results{display:grid;gap:16px}
.res{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 18px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:14px}
.res-k{font-size:18px;font-weight:600;color:var(--ink-2)}
.res-v{font-family:var(--font-display);font-size:38px;font-weight:700;letter-spacing:-0.015em;font-variant-numeric:tabular-nums;line-height:1.2}
.res-v .from{color:var(--ink-3);font-weight:500}
.res-s{grid-column:2;font-size:16px;color:var(--ink-2)}

/* ---------- 발표 화면 ---------- */
.deck{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px)}
.deck-area{min-height:0;display:flex;align-items:center;justify-content:center;padding:20px max(20px,env(safe-area-inset-right,0px)) 12px max(20px,env(safe-area-inset-left,0px));overflow:hidden}

.dnav{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

.dnav .btn{background:var(--surface)}
.dnav .btn.quiet{background:transparent}

.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px;display:grid;gap:26px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-size:0.78rem;font-weight:600;color:var(--ink-3);letter-spacing:0.04em}
.top h1{font-family:var(--font-display);font-size:clamp(1.4rem,2.8vw,1.85rem);font-weight:700;margin:2px 0 0;letter-spacing:-0.01em;line-height:1.3}
.top p{margin:6px 0 0;color:var(--ink-2);max-width:62ch;font-size:0.95rem}
.tag{font-family:var(--font-mono);font-size:0.8rem;color:var(--jev)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.card{display:grid;gap:14px;min-width:0}
.card-frame{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.card-frame .fit{margin:0}
.card-meta{display:grid;gap:12px}
.notes summary,details.tv summary{cursor:pointer;color:var(--ink-2);font-size:0.88rem;font-weight:500}
.notes p{margin:8px 0 0;color:var(--ink-2);max-width:66ch;font-size:0.95rem}
.tbl{border-collapse:collapse;width:100%;font-size:0.86rem;font-variant-numeric:tabular-nums;margin-top:8px}

.tbl-scroll{overflow-x:auto}
.adds{display:grid;gap:6px}
.add-item{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:0.92rem;color:var(--ink-2)}
.add-item b{color:var(--ink);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.actions .spacer{flex:1}
.confirm{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:0.9rem;color:var(--ink-2)}
.form{display:grid;gap:10px;border:1px dashed var(--ink-3);border-radius:12px;padding:16px;background:var(--surface-2)}
.form label{display:grid;gap:4px;font-size:0.84rem;color:var(--ink-2);font-weight:500}
.form input,.form textarea{font:inherit;font-size:0.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.form textarea{min-height:96px;resize:vertical;line-height:1.55}
.form .row{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:0.8rem;color:var(--ink-3);font-weight:400}
.newslide{display:grid;gap:12px}
.newslide > .btn{justify-self:start}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:min(560px,calc(100vw - 32px));border-radius:10px;padding:10px 16px;font-size:0.92rem;border:1px solid var(--jev);background:var(--surface);color:var(--ink);box-shadow:0 6px 24px rgba(0,0,0,0.16)}
.toast.warn{border-color:var(--llm);background:var(--llm-soft)}
.tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--surface);font-size:0.8rem;padding:6px 9px;border-radius:7px;max-width:260px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,0.18)}

/* ---------- 좁은 화면: 슬라이드를 줄이지 않고 세로로 풀어 보여 준다 ---------- */
@media (max-width:720px){
  .fit{width:auto!important;height:auto!important}

  function fitAll() {

        var aw = area.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        var ah = area.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
        s = Math.max(0.1, Math.min(aw / W, ah / H));
      } else {
        s = Math.max(0.1, f.parentElement.clientWidth / W);
      }
      f.style.width = (W * s) + "px"; f.style.height = (H * s) + "px";
      st.style.transform = "scale(" + s + ")";

  function commit(mutate, withDraft) {

    ui.busy = true; ui.draft = draft; ui.toast = {text: "저장하는 중입니다…", kind: "ok"}; render();

          if (code === "upstream_error" && tries < 2) { setTimeout(attempt, 600 + Math.random() * 900); return; }
          ui.busy = false;
          if (code === "conflict") { toast("다른 사람이 먼저 저장해서 새 버전을 불러오는 중입니다. 방금 쓴 내용은 다시 채워집니다.", "warn"); return; }
          ss.clear();
          if (code === "not_writer" || code === "not_granted") { ui.readOnly = true; toast("보기 전용으로 열려 있어 저장할 수 없습니다. 문서 주인에게 편집 권한을 받아 주세요.", "warn"); }
          else if (code === "rate_limited") toast("저장이 잠시 막혔습니다. 몇 초 뒤에 다시 저장해 주세요.", "warn");
          else toast("저장하지 못했습니다(" + (code || "알 수 없는 오류") + "). 잠시 뒤에 다시 저장해 주세요.", "warn");
        });
      })();
    });
  }

  function focusFirst() { var f = app.querySelector("form.form input, form.form textarea"); if (f) f.focus(); }
  function setMode(m, cur) {
    ui.mode = m; if (cur != null) ui.cur = cur; ui.open = null; ui.draft = null; ui.confirm = null; ui.toast = null;
    render(); window.scrollTo(0, 0);
    if (m === "overview" && cur != null) { var c = app.querySelectorAll(".card")[cur]; if (c) c.scrollIntoView({block: "start"}); }
  }
  function go(d) { var n = state.slides.length; ui.cur = Math.min(n - 1, Math.max(0, ui.cur + d)); render(); }

  app.addEventListener("submit", function (e) { e.preventDefault(); });
  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    var act = b.getAttribute("data-act"), id = b.getAttribute("data-id"), k = b.hasAttribute("data-k") ? +b.getAttribute("data-k") : null;
    if (act === "present") setMode("deck", 0);
    else if (act === "show") setMode("deck", findSlide(state, id));
    else if (act === "overview") setMode("overview", ui.cur);
    else if (act === "prev") go(-1);
    else if (act === "next") go(1);
    else if (act === "full") { try { var p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(function () {}); } catch (err) {} }
    else if (act === "open-note" || act === "open-edit") { ui.open = {kind: act === "open-note" ? "note" : "edit", id: id}; ui.draft = null; ui.confirm = null; render(); focusFirst(); }
    else if (act === "open-new") { ui.open = {kind: "new"}; ui.draft = null; ui.confirm = null; render(); focusFirst(); var nf = app.querySelector(".newslide"); if (nf) nf.scrollIntoView({block: "center"}); }
    else if (act === "cancel") { ui.open = null; ui.draft = null; ui.confirm = null; render(); }
    else if (act === "ask-del-slide") { ui.confirm = {kind: "slide", id: id}; render(); }
    else if (act === "ask-del-note") { ui.confirm = {kind: "note", id: id, k: k}; render(); }
    else if (act === "save-note") {
      var text = val("f-note-" + id).trim(), who = val("f-who-" + id).trim();
      if (!text) { ui.draft = captureDraft(); toast("덧붙일 내용을 적어 주세요.", "warn"); focusFirst(); return; }
      commit(function (st) { var i = findSlide(st, id); if (i >= 0) { st.slides[i].addenda = st.slides[i].addenda || []; st.slides[i].addenda.push({who: who || "팀원", text: text}); } }, true);
    }
    else if (act === "save-edit") {
      var title = val("f-title-" + id).trim(), lead = val("f-lead-" + id).trim(), pts = lines(val("f-points-" + id)), notes = val("f-notes-" + id).trim(), ed = val("f-editor-" + id).trim();
      if (!title) { ui.draft = captureDraft(); toast("제목을 적어 주세요.", "warn"); return; }
      commit(function (st) { var i = findSlide(st, id); if (i < 0) return; var s = st.slides[i]; s.title = title; s.lead = lead; s.points = pts; s.notes = notes; s.edited = addName(s.edited, ed || "팀원"); }, true);
    }
    else if (act === "save-new") {
      var nt = val("f-new-title").trim(), np = lines(val("f-new-points")), nn = val("f-new-notes").trim(), nw = val("f-new-who").trim();
      if (!nt) { ui.draft = captureDraft(); toast("새 슬라이드의 제목을 적어 주세요.", "warn"); return; }
      commit(function (st) { st.slides.push({id: "s" + Date.now().toString(36), by: "[" + (nw || "팀원") + "]", kicker: "", layout: "text", title: nt, lead: "", pointsLabel: "", points: np, visual: null, src: "", notes: nn, addenda: [], edited: []}); }, true);
    }
    else if (act === "up" || act === "down") {
      commit(function (st) { var i = findSlide(st, id), j = act === "up" ? i - 1 : i + 1; if (i < 0 || j < 0 || j >= st.slides.length) return; var t = st.slides[i]; st.slides[i] = st.slides[j]; st.slides[j] = t; }, false);
    }
    else if (act === "del-slide") commit(function (st) { var i = findSlide(st, id); if (i >= 0) st.slides.splice(i, 1); }, false);
    else if (act === "del-note") commit(function (st) { var i = findSlide(st, id); if (i >= 0 && st.slides[i].addenda) st.slides[i].addenda.splice(k, 1); }, false);
  });

  document.addEventListener("keydown", function (e) {
    if (ui.mode !== "deck") return;
    var t = e.target && e.target.tagName;
    if (t === "INPUT" || t === "TEXTAREA") return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " " || e.key === "Enter") { e.preventDefault(); go(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp" || e.key === "Backspace") { e.preventDefault(); go(-1); }
    else if (e.key === "Home") { e.preventDefault(); ui.cur = 0; render(); }
    else if (e.key === "End") { e.preventDefault(); ui.cur = state.slides.length - 1; render(); }
  });
  window.addEventListener("resize", fitAll);
  if (narrowMQ.addEventListener) narrowMQ.addEventListener("change", fitAll);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

  var tip = document.createElement("div");
  tip.className = "tip"; tip.hidden = true; tip.setAttribute("role", "tooltip");
  document.body.appendChild(tip);
  function place(e) {
    var pad = 12, x = e.clientX + pad, y = e.clientY + pad, r = tip.getBoundingClientRect();
    if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - pad;
    if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - pad;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
  }
  document.addEventListener("pointerover", function (e) {
    var el = e.target.closest && e.target.closest("[data-tip]");
    if (!el) { tip.hidden = true; return; }
    tip.textContent = el.getAttribute("data-tip"); tip.hidden = false; place(e);
  });
  document.addEventListener("pointermove", function (e) { if (!tip.hidden) place(e); });
  document.addEventListener("pointerleave", function () { tip.hidden = true; });
  window.addEventListener("scroll", function () { tip.hidden = true; }, {passive: true});

  render();
  if (ui.open) focusFirst();
})();
</script>
</body></html>
